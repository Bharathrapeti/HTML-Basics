<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Border Example</title>

    <!-- Connect CSS File -->
    <link rel="stylesheet" href="../CSS-Basics/border.css">

</head>
<body>

    <h1>Welcome to CSS Borders</h1>

    <h2>Learning Different Border Styles</h2>

    <p class="solid">
        This paragraph has a solid border.
    </p>

    <p class="dashed">
        This paragraph has a dashed border.
    </p>

    <p class="dotted">
        This paragraph has a dotted border.
    </p>

    <p class="double">
        This paragraph has a double border.
    </p>

    <p class="rounded">
        This paragraph has rounded corners.
    </p>

    <p class="shadow">
        This paragraph has a border with a shadow effect.
    </p>

</body>
</html>
