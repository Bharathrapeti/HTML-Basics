<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Font Example</title>

    <!-- Connect CSS File -->
    <link rel="stylesheet" href="../CSS-Basics/styles.css">

</head>
<body>

    <h1>Welcome to CSS Fonts</h1>

    <h2>Learning Different Font Styles</h2>

    <p class="normal">
        This is normal paragraph text.
    </p>

    <p class="italic">
        This text is italic.
    </p>

    <p class="bold">
        This text is bold.
    </p>

    <p class="uppercase">
        This text is in uppercase.
    </p>

    <p class="spacing">
        This paragraph has increased letter spacing.
    </p>

    <p class="shadow">
        This text has a shadow effect.
    </p>

</body>
</html>
