<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Height and Width</title>

    <link rel="stylesheet" href="../CSS-Basics/height-width.css">
</head>
<body>

    <h1>CSS Height and Width Examples</h1>

    <h2>1. Fixed Width and Height</h2>

    <div class="box1">
        Width: 300px <br>
        Height: 150px
    </div>

    <hr>

    <h2>2. Percentage Width</h2>

    <div class="box2">
        Width: 60%
    </div>

    <hr>

    <h2>3. Auto Width</h2>

    <div class="box3">
        Width: Auto
    </div>

    <hr>

    <h2>4. Maximum Width</h2>

    <div class="box4">
        Max Width: 500px
    </div>

    <hr>

    <h2>5. Minimum Height</h2>

    <div class="box5">
        This box has a minimum height of 120px.
    </div>

</body>
</html>
