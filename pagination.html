<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Pagination</title>

    <link rel="stylesheet" href="../CSS-Basics/pagination.css">
</head>
<body>

<h1>CSS Pagination Examples</h1>

<h2>Simple Pagination</h2>

<div class="pagination">

    <a href="#">&laquo;</a>

    <a href="#">1</a>

    <a href="#" class="active">2</a>

    <a href="#">3</a>

    <a href="#">4</a>

    <a href="#">5</a>

    <a href="#">&raquo;</a>

</div>

<hr>

<h2>Rounded Pagination</h2>

<div class="pagination round">

    <a href="#">&laquo;</a>

    <a href="#">1</a>

    <a href="#" class="active">2</a>

    <a href="#">3</a>

    <a href="#">4</a>

    <a href="#">&raquo;</a>

</div>

</body>
</html>
