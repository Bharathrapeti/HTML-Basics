<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Defender 🚀</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        
        h1 {
            margin-bottom: 10px;
            text-shadow: 0 0 20px #e94560;
            font-size: 2.5em;
        }
        
        #gameContainer {
            position: relative;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }
        
        canvas {
            display: block;
            background: linear-gradient(to bottom, #0a0a0a, #1a1a3e);
            border-radius: 10px;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
            background: rgba(0,0,0,0.9);
            padding: 30px;
            border-radius: 15px;
            border: 2px solid #e94560;
        }
        
        #gameOver h2 {
            color: #e94560;
            font-size: 2.5em;
            margin-bottom: 15px;
        }
        
        #gameOver p {
            font-size: 1.3em;
            margin-bottom: 20px;
        }
        
        button {
            background: linear-gradient(135deg, #e94560, #ff6b6b);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(233, 69, 96, 0.6);
        }
        
        #instructions {
            margin-top: 15px;
            text-align: center;
            color: #aaa;
            font-size: 0.95em;
        }
        
        .health-bar {
            width: 150px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #fff;
        }
        
        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff4757, #2ed573);
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <h1>🚀 SPACE DEFENDER 🚀</h1>
    
    <div id="gameContainer">
        <canvas id="gameCanvas" width="600" height="700"></canvas>
        
        <div id="ui">
            <div>Score: <span id="score">0</span></div>
            <div class="health-bar">
                <div class="health-fill" id="healthBar" style="width: 100%"></div>
            </div>
        </div>
        
        <div id="gameOver">
            <h2>GAME OVER</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>
    
    <div id="instructions">
        <p>🎮 <strong>Controls:</strong> Arrow Keys or WASD to move | SPACE to shoot | P to pause</p>
        <p>💥 Destroy enemies, avoid getting hit, survive as long as you can!</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // Game state
        let gameRunning = true;
        let score = 0;
        let health = 100;
        let frameCount = 0;
        let difficulty = 1;
        
        // Player
        const player = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 100,
            width: 50,
            height: 50,
            speed: 6,
            color: '#00d4ff'
        };
        
        // Input handling
        const keys = {};
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space') shoot();
            if (e.code === 'KeyP') togglePause();
        });
        document.addEventListener('keyup', (e) => keys[e.code] = false);
        
        // Game objects
        let bullets = [];
        let enemies = [];
        let particles = [];
        let stars = [];
        
        // Initialize stars for background
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 0.5 + 0.1
            });
        }
        
        function shoot() {
            if (!gameRunning) return;
            bullets.push({
                x: player.x + player.width / 2 - 3,
                y: player.y,
                width: 6,
                height: 15,
                speed: 10,
                color: '#ffeb3b'
            });
        }
        
        function spawnEnemy() {
            const size = Math.random() * 20 + 30;
            enemies.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                width: size,
                height: size,
                speed: Math.random() * 2 + 1 + difficulty,
                hp: Math.floor(size / 10),
                color: `hsl(${Math.random() * 60 + 300}, 70%, 50%)`
            });
        }
        
        function createParticles(x, y, color, count = 8) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 30,
                    color: color,
                    size: Math.random() * 4 + 2
                });
            }
        }
        
        function update() {
            if (!gameRunning) return;
            
            frameCount++;
            difficulty = 1 + Math.floor(score / 500) * 0.3;
            
            // Player movement
            if (keys['ArrowLeft'] || keys['KeyA']) player.x -= player.speed;
            if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
            if (keys['ArrowUp'] || keys['KeyW']) player.y -= player.speed;
            if (keys['ArrowDown'] || keys['KeyS']) player.y += player.speed;
            
            // Keep player in bounds
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
            player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
            
            // Spawn enemies
            if (frameCount % Math.max(30, 60 - Math.floor(difficulty * 10)) === 0) {
                spawnEnemy();
            }
            
            // Update bullets
            bullets = bullets.filter(bullet => {
                bullet.y -= bullet.speed;
                return bullet.y > -bullet.height;
            });
            
            // Update enemies
            enemies = enemies.filter(enemy => {
                enemy.y += enemy.speed;
                enemy.x += Math.sin(enemy.y / 50) * 2; // Slight wave motion
                
                // Check collision with player
                if (rectIntersect(player, enemy)) {
                    health -= 20;
                    createParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.color, 15);
                    updateHealthBar();
                    if (health <= 0) gameOver();
                    return false;
                }
                
                // Check collision with bullets
                for (let i = bullets.length - 1; i >= 0; i--) {
                    if (rectIntersect(bullets[i], enemy)) {
                        enemy.hp--;
                        bullets.splice(i, 1);
                        if (enemy.hp <= 0) {
                            score += 10 * Math.floor(enemy.width / 10);
                            createParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, enemy.color);
                            document.getElementById('score').textContent = score;
                            return false;
                        }
                    }
                }
                
                return enemy.y < canvas.height + enemy.height;
            });
            
            // Update particles
            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // gravity
                p.life--;
                return p.life > 0;
            });
            
            // Update stars
            stars.forEach(star => {
                star.y += star.speed + difficulty * 0.5;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
            });
        }
        
        function rectIntersect(r1, r2) {
            return !(r2.x > r1.x + r1.width || 
                     r2.x + r2.width < r1.x || 
                     r2.y > r1.y + r1.height || 
                     r2.y + r2.height < r1.y);
        }
        
        function draw() {
            // Clear canvas
            ctx.fillStyle = 'rgba(10, 10, 30, 0.3)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw stars
            ctx.fillStyle = 'white';
            stars.forEach(star => {
                ctx.globalAlpha = Math.random() * 0.5 + 0.5;
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
            
            // Draw player (spaceship)
            ctx.save();
            ctx.translate(player.x + player.width/2, player.y + player.height/2);
            
            // Ship body
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.moveTo(0, -player.height/2);
            ctx.lineTo(-player.width/2, player.height/2);
            ctx.lineTo(0, player.height/2 - 10);
            ctx.lineTo(player.width/2, player.height/2);
            ctx.closePath();
            ctx.fill();
            
            // Engine glow
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.moveTo(-8, player.height/2 - 5);
            ctx.lineTo(0, player.height/2 + 10 + Math.random() * 10);
            ctx.lineTo(8, player.height/2 - 5);
            ctx.closePath();
            ctx.fill();
            
            ctx.restore();
            
            // Draw bullets
            ctx.fillStyle = '#ffeb3b';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ffeb3b';
            bullets.forEach(bullet => {
                ctx.fillRect(bullet.x, bullet.y, bullet.width, bullet.height);
            });
            ctx.shadowBlur = 0;
            
            // Draw enemies
            enemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                ctx.save();
                ctx.translate(enemy.x + enemy.width/2, enemy.y + enemy.height/2);
                ctx.rotate(frameCount * 0.02);
                
                // Enemy shape (diamond)
                ctx.beginPath();
                ctx.moveTo(0, -enemy.height/2);
                ctx.lineTo(enemy.width/2, 0);
                ctx.lineTo(0, enemy.height/2);
                ctx.lineTo(-enemy.width/2, 0);
                ctx.closePath();
                ctx.fill();
                
                // Inner glow
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.arc(0, 0, enemy.width/4, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.restore();
            });
            
            // Draw particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 30;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }
        
        function updateHealthBar() {
            document.getElementById('healthBar').style.width = health + '%';
        }
        
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('gameOver').style.display = 'block';
        }
        
        function restartGame() {
            gameRunning = true;
            score = 0;
            health = 100;
            difficulty = 1;
            bullets = [];
            enemies = [];
            particles = [];
            player.x = canvas.width / 2 - 25;
            player.y = canvas.height - 100;
            document.getElementById('score').textContent = '0';
            document.getElementById('gameOver').style.display = 'none';
            updateHealthBar();
            gameLoop();
        }
        
        function togglePause() {
            gameRunning = !gameRunning;
            if (gameRunning) gameLoop();
        }
        
        function gameLoop() {
            if (!gameRunning) return;
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        
        // Start the game
        gameLoop();
    </script>
</body>
</html>
